<!DOCTYPE html>
<html>
  <body>
    <!-- 完全にダミーフォーム専用 -->
    <form
      name="contact-form"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="text"
        name="company_name"
      />
      <input
        type="text"
        name="name"
      />

      <input
        type="text"
        name="email"
      />
      <input
        type="text"
        name="phone"
      />

      <select name="inquiry_type">
        <option>システム開発について</option>
        <option>マーケティングについて</option>
        <option>お見積もり・ご相談</option>
        <option>その他</option>
      </select>

      <textarea name="message"></textarea>
      <input
        type="text"
        name="bot-field"
      />
    </form>
  </body>
</html>
